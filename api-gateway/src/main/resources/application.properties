spring.application.name=api-gateway
server.port=${PORT:8080}

# Security is enabled by Compose with Keycloak. Keeping the explicit switch makes
# standalone source-level tests possible without silently disabling security in
# the container deployment.
security.enabled=${SECURITY_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/home-energy}
# Browser tokens carry the public localhost issuer. Containers retrieve signing
# keys through the Docker network, while issuer validation remains public-URL based.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/home-energy/protocol/openid-connect/certs}
# Machine telemetry uses a separate device token so the existing Wokwi ESP32
# does not need to store an interactive user JWT.
iot.ingestion.token=${WOKWI_INGESTION_TOKEN:}
# A private proof forwarded only for JWT-originated telemetry. It lets the
# ingestion service distinguish a gateway-injected owner header from a caller
# attempting to forge one on the shared Docker network.
iot.ingestion.gateway-internal-token=${INTERNAL_GATEWAY_TOKEN:}

# Spring Cloud Gateway Routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/user,/api/v1/user/**

spring.cloud.gateway.routes[1].id=device-service
spring.cloud.gateway.routes[1].uri=${DEVICE_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/device,/api/v1/device/**

spring.cloud.gateway.routes[2].id=ingestion-service
spring.cloud.gateway.routes[2].uri=${INGESTION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/ingestion,/api/v1/ingestion/**

spring.cloud.gateway.routes[3].id=usage-service
spring.cloud.gateway.routes[3].uri=${USAGE_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/usage,/api/v1/usage/**

spring.cloud.gateway.routes[4].id=alert-service
spring.cloud.gateway.routes[4].uri=${ALERT_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/alert,/api/v1/alert/**

spring.cloud.gateway.routes[5].id=insight-service
spring.cloud.gateway.routes[5].uri=${INSIGHT_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/insight,/api/v1/insight/**

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Correlation ID Console Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n
