spring.application.name=ingestion-service
server.port=${PORT:8083}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.template.default-topic=energy-usage
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Defense in depth for the simulator-compatible telemetry route. When enabled,
# a user JWT is bound to the device owner through device-service, while a
# machine token must match the explicit deviceId:token mapping. Docker Compose
# enables this; standalone demos can opt in explicitly.
ingestion.authorization.required=${INGESTION_AUTH_REQUIRED:false}
device.service.url=${DEVICE_SERVICE_URL:http://localhost:8082/api/v1/device}
iot.ingestion.device-tokens=${IOT_INGESTION_DEVICE_TOKENS:}
iot.ingestion.allow-legacy-global-token=${IOT_INGESTION_LEGACY_GLOBAL_TOKEN_ENABLED:false}
iot.ingestion.token=${WOKWI_INGESTION_TOKEN:}
# Shared only between the gateway and ingestion service for the trusted owner
# header path; device-token telemetry does not send this header.
iot.ingestion.gateway-internal-token=${INTERNAL_GATEWAY_TOKEN:}

# Continuous simulation configuration
simulation.endpoint=${SIMULATION_ENDPOINT:http://localhost:8083/api/v1/ingestion}
simulation.enabled=${SIMULATION_ENABLED:false}
simulation.requests-per-interval=${SIMULATION_REQUESTS_PER_INTERVAL:10}
simulation.interval-ms=${SIMULATION_INTERVAL_MS:60000}
simulation.parallel-threads=${SIMULATION_PARALLEL_THREADS:1}
# Simulator requests use the same device-bound telemetry contract as a Wokwi
# device.  The selected ID must have a matching IOT_INGESTION_DEVICE_TOKENS
# mapping whenever ingestion.authorization.required=true.
simulation.device-id=${SIMULATION_DEVICE_ID:1}
simulation.device-token=${SIMULATION_DEVICE_TOKEN:}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Correlation ID Console Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n
