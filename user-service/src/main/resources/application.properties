spring.application.name=user-service
server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/home_energy_tracker}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
# This service owns the shared-schema migrations. On an existing schema Flyway
# validates the recorded history and applies only pending versions.
spring.flyway.enabled=true

# Gateway and background-service credentials used to authenticate callers of
# this private API. Compose supplies both; blank standalone values fail closed
# for API requests while still allowing source-level construction.
security.internal.gateway-token=${INTERNAL_GATEWAY_TOKEN:}
security.internal.service-token=${INTERNAL_SERVICE_TOKEN:}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Correlation ID Console Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n
