spring.application.name=usage-service
server.port=${PORT:8084}

# Kafka - consumer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=usage-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.hometracker.kafka.event.EnergyUsageEvent
# Commit records individually after successful listener processing. This limits
# re-delivery scope when a single InfluxDB write is retried or dead-lettered.
spring.kafka.listener.ack-mode=record

# Kafka - producer
spring.kafka.template.default-topic=energy-alerts
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Influx DB Configuration
influx.url=${INFLUX_URL:http://localhost:8072}
influx.token=${INFLUX_TOKEN:local-influx-admin-token}
influx.org=${INFLUX_ORG:hometracker}
influx.bucket=${INFLUX_BUCKET:usage-bucket}

# Kafka retry/DLT policy for an energy-usage record that cannot be persisted to
# InfluxDB: one initial attempt plus this many retries, then <source>.DLT.
usage.kafka.influx.retry-delay-ms=${USAGE_INFLUX_RETRY_DELAY_MS:1000}
usage.kafka.influx.max-retries=${USAGE_INFLUX_MAX_RETRIES:2}
usage.kafka.influx.failure-topic-suffix=${USAGE_INFLUX_FAILURE_TOPIC_SUFFIX:.DLT}

# Internal Microservice Client Dependencies
device.service.url=${DEVICE_SERVICE_URL:http://localhost:8082/api/v1/device}
user.service.url=${USER_SERVICE_URL:http://localhost:8081/api/v1/user}
internal.service.token=${INTERNAL_SERVICE_TOKEN:}
security.internal.gateway-token=${INTERNAL_GATEWAY_TOKEN:}
security.internal.service-token=${INTERNAL_SERVICE_TOKEN:}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Correlation ID Console Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n
