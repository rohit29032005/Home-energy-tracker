spring.datasource.url=jdbc:h2:mem:alert_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.kafka.bootstrap-servers=localhost:65535
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.task.scheduling.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.test-connection=false
device.service.url=http://localhost:65534/api/v1/device
user.service.url=http://localhost:65534/api/v1/user
