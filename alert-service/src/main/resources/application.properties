spring.application.name=alert-service
server.port=${PORT:8085}

# Kafka - consumer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=alert-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.hometracker.kafka.event.AlertingEvent

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/home_energy_tracker}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
# Shared-schema migrations are owned by user-service.
spring.flyway.enabled=false

# Duplicate notifications with the same user/device/type key are suppressed only
# inside this explicit, configurable window.
alerts.deduplication.enabled=${ALERT_DEDUPLICATION_ENABLED:true}
alerts.deduplication.window-minutes=${ALERT_DEDUPLICATION_WINDOW_MINUTES:15}
device.service.url=${DEVICE_SERVICE_URL:http://localhost:8082/api/v1/device}
user.service.url=${USER_SERVICE_URL:http://localhost:8081/api/v1/user}
internal.service.token=${INTERNAL_SERVICE_TOKEN:}
# Alert REST endpoints accept only the separate gateway proof. Background
# services keep using internal.service.token solely for their outbound lookups.
security.internal.gateway-token=${INTERNAL_GATEWAY_TOKEN:}

# Mailpit SMTP Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Correlation ID Console Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n
