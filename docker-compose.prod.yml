services:
  # Reverse Proxy & Frontend Web Server
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: home-energy-nginx-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - energy-net

  # Infrastructure Databases & Messaging
  mysql:
    image: mysql:8.3.0
    container_name: home-energy-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-home_energy_tracker}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data-prod:/var/lib/mysql
    networks:
      - energy-net

  kafka:
    image: apache/kafka:latest
    container_name: home-energy-kafka-prod
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: 'energy-tracker-cluster-prod'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data-prod:/var/lib/kafka/data
    networks:
      - energy-net

  influxdb:
    image: influxdb:2.7
    container_name: home-energy-influxdb-prod
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-hometracker}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-usage-bucket}
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influx-data-prod:/var/lib/influxdb2
    networks:
      - energy-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: home-energy-mailpit-prod
    restart: always
    networks:
      - energy-net

  # Application Microservices
  user-service:
    build: ./user-service
    container_name: home-energy-user-service-prod
    restart: always
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-home_energy_tracker}?useSSL=false
      MYSQL_USER: ${MYSQL_USER:-hometracker_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN must be set in production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in production}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - energy-net

  device-service:
    build: ./device-service
    container_name: home-energy-device-service-prod
    restart: always
    environment:
      PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-home_energy_tracker}?useSSL=false
      MYSQL_USER: ${MYSQL_USER:-hometracker_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN must be set in production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in production}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - energy-net

  ingestion-service:
    build: ./ingestion-service
    container_name: home-energy-ingestion-service-prod
    restart: always
    environment:
      PORT: 8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SIMULATION_ENDPOINT: http://ingestion-service:8083/api/v1/ingestion
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
      SIMULATION_REQUESTS_PER_INTERVAL: ${SIMULATION_REQUESTS_PER_INTERVAL:-10}
      SIMULATION_INTERVAL_MS: ${SIMULATION_INTERVAL_MS:-60000}
      SIMULATION_PARALLEL_THREADS: ${SIMULATION_PARALLEL_THREADS:-1}
      SIMULATION_DEVICE_ID: ${SIMULATION_DEVICE_ID:-1}
      SIMULATION_DEVICE_TOKEN: ${SIMULATION_DEVICE_TOKEN:-${WOKWI_INGESTION_TOKEN:?WOKWI_INGESTION_TOKEN must be set in production}}
      # This is deliberately fixed on in production. Setting it false would
      # bypass device-token and JWT owner binding at the telemetry publisher.
      INGESTION_AUTH_REQUIRED: "true"
      DEVICE_SERVICE_URL: http://device-service:8082/api/v1/device
      IOT_INGESTION_DEVICE_TOKENS: ${IOT_INGESTION_DEVICE_TOKENS:?IOT_INGESTION_DEVICE_TOKENS must be set in production}
      IOT_INGESTION_LEGACY_GLOBAL_TOKEN_ENABLED: "false"
      WOKWI_INGESTION_TOKEN: ${WOKWI_INGESTION_TOKEN:?WOKWI_INGESTION_TOKEN must be set in production}
      # Required shared proof for the gateway-injected JWT owner header. It is
      # deliberately not exposed to frontend or Wokwi containers.
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN must be set in production}
    depends_on:
      kafka:
        condition: service_started
      device-service:
        condition: service_started
    networks:
      - energy-net

  ml-inference-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: home-energy-ml-inference-service-prod
    restart: always
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_MAX_PROCESSING_ATTEMPTS: ${KAFKA_MAX_PROCESSING_ATTEMPTS:-3}
      KAFKA_CONNECTION_RETRY_SECONDS: ${KAFKA_CONNECTION_RETRY_SECONDS:-5}
      LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_started
    networks:
      - energy-net

  usage-service:
    build: ./usage-service
    container_name: home-energy-usage-service-prod
    restart: always
    environment:
      PORT: 8084
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-hometracker}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-usage-bucket}
      DEVICE_SERVICE_URL: http://device-service:8082/api/v1/device
      USER_SERVICE_URL: http://user-service:8081/api/v1/user
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN must be set in production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in production}
    depends_on:
      kafka:
        condition: service_started
      influxdb:
        condition: service_healthy
      user-service:
        condition: service_started
      device-service:
        condition: service_started
    networks:
      - energy-net

  alert-service:
    build: ./alert-service
    container_name: home-energy-alert-service-prod
    restart: always
    environment:
      PORT: 8085
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-home_energy_tracker}?useSSL=false
      MYSQL_USER: ${MYSQL_USER:-hometracker_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      DEVICE_SERVICE_URL: http://device-service:8082/api/v1/device
      USER_SERVICE_URL: http://user-service:8081/api/v1/user
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN must be set in production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in production}
      ALERT_DEDUPLICATION_ENABLED: ${ALERT_DEDUPLICATION_ENABLED:-true}
      ALERT_DEDUPLICATION_WINDOW_MINUTES: ${ALERT_DEDUPLICATION_WINDOW_MINUTES:-15}
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - energy-net

  insight-service:
    build: ./insight-service
    container_name: home-energy-insight-service-prod
    restart: always
    environment:
      PORT: 8086
      USAGE_SERVICE_URL: http://usage-service:8084/api/v1/usage
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN must be set in production}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in production}
    depends_on:
      usage-service:
        condition: service_started
    networks:
      - energy-net

  api-gateway:
    build: ./api-gateway
    container_name: home-energy-api-gateway-prod
    restart: always
    environment:
      PORT: 8080
      USER_SERVICE_URL: http://user-service:8081
      DEVICE_SERVICE_URL: http://device-service:8082
      INGESTION_SERVICE_URL: http://ingestion-service:8083
      USAGE_SERVICE_URL: http://usage-service:8084
      ALERT_SERVICE_URL: http://alert-service:8085
      INSIGHT_SERVICE_URL: http://insight-service:8086
      SECURITY_ENABLED: ${SECURITY_ENABLED:?SECURITY_ENABLED must be set in production}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI must be set in production}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:?KEYCLOAK_JWK_SET_URI must be set in production}
      WOKWI_INGESTION_TOKEN: ${WOKWI_INGESTION_TOKEN:?WOKWI_INGESTION_TOKEN must be set in production}
      IOT_INGESTION_DEVICE_TOKENS: ${IOT_INGESTION_DEVICE_TOKENS:?IOT_INGESTION_DEVICE_TOKENS must be set in production}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:?INTERNAL_GATEWAY_TOKEN must be set in production}
    depends_on:
      user-service:
        condition: service_started
      device-service:
        condition: service_started
      ingestion-service:
        condition: service_started
      usage-service:
        condition: service_started
      alert-service:
        condition: service_started
      insight-service:
        condition: service_started
    networks:
      - energy-net

  # Monitoring stays on the internal Docker network. Grafana is bound only to
  # loopback so an operator can reach it through a host tunnel or reverse proxy
  # with a separately managed TLS/authentication policy.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: home-energy-prometheus-prod
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-prod:/prometheus
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - energy-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: home-energy-grafana-prod
    restart: always
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in production}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-prod:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - energy-net

networks:
  energy-net:
    driver: bridge

volumes:
  db-data-prod:
  kafka-data-prod:
  influx-data-prod:
  prometheus-data-prod:
  grafana-data-prod:
