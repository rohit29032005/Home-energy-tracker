spring.application.name=insight-service
server.port=${PORT:8086}

usage.service.url=${USAGE_SERVICE_URL:http://localhost:8084/api/v1/usage}
security.internal.gateway-token=${INTERNAL_GATEWAY_TOKEN:}
internal.service.token=${INTERNAL_SERVICE_TOKEN:}

spring.ai.ollama.chat.options.model=deepseek-coder
spring.ai.ollama.init.pull-model-strategy=never

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Correlation ID Console Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n

# Energy Tariff Configurations
tariff.fixed-charge=${TARIFF_FIXED_CHARGE:10.00}
tariff.slab1-limit=${TARIFF_SLAB1_LIMIT:100.0}
tariff.slab1-rate=${TARIFF_SLAB1_RATE:0.12}
tariff.slab2-limit=${TARIFF_SLAB2_LIMIT:300.0}
tariff.slab2-rate=${TARIFF_SLAB2_RATE:0.18}
tariff.slab3-rate=${TARIFF_SLAB3_RATE:0.25}
